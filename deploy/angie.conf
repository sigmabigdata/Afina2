# ─────────────────────────────────────────────────────────────
# Afina2 · Angie (сертифицированный веб-сервер)
#
# Раздаёт React SPA и проксирует REST API на backend.
# Безопасность: CSP без unsafe-eval, HSTS, запрет встраивания,
# ограничение размера тела запроса, скрытие версии сервера.
# ─────────────────────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 60m;
    client_body_timeout 60s;
    client_header_timeout 20s;

    # Сжатие текстовых ресурсов
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    # Логи
    log_format  afina  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" rt=$request_time';
    access_log /var/log/angie/access.log afina;
    error_log  /var/log/angie/error.log warn;

    # Защита от медленных клиентов
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Внешний порт: из заголовка Host (учитывает нестандартные порты вроде 8088),
    # иначе — порт сокета (80/443 в продуктивной эксплуатации)
    map $http_host $afina_external_port {
        "~^.*:(\d+)$" $1;
        default       $server_port;
    }

    upstream afina_backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/angie/html;
        index index.html;

        # ── Общие security-заголовки ──
        # Заголовки безопасности подключаются в каждом location (см. ниже)

        # Healthcheck контейнера
        # Заголовки безопасности — общий сниппет (см. /etc/angie/security-headers.conf)
        include /etc/angie/security-headers.conf;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── REST API ──
        location /api/ {
            include /etc/angie/security-headers.conf;
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://afina_backend;
            proxy_http_version 1.1;
            # $http_host сохраняет порт (важно для абсолютных редиректов приложения)
            proxy_set_header Host $http_host;
            # Внешний порт (в т.ч. нестандартный) — иначе абсолютные
            # редиректы приложения теряют порт
            proxy_set_header X-Forwarded-Port $afina_external_port;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            # Файлы и подписи не должны кешироваться
            proxy_buffering off;
        }

        # Actuator — только изнутри контура
        location /actuator/ {
            include /etc/angie/security-headers.conf;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://afina_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Port $afina_external_port;
        }

        location /api/v1/openapi {
            include /etc/angie/security-headers.conf;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://afina_backend;
        }

        # ── Статика SPA с хешами в именах ──
        location /assets/ {
            include /etc/angie/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA fallback ──
        location / {
            include /etc/angie/security-headers.conf;
            try_files $uri $uri/ /index.html;
            # expires -1 не сбрасывает унаследованные add_header (в отличие от add_header)
            expires -1;
        }
    }
}
